name: Praktikum1 Tests

on:
  push:
    paths:
      - "Praktikum1/**"
      - ".github/workflows/praktikum1-tests.yml"
  pull_request:
    paths:
      - "Praktikum1/**"
      - ".github/workflows/praktikum1-tests.yml"
  workflow_dispatch:

jobs:
  test:
    name: Testkette (Python ${{ matrix.python }}, ${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        image: ["redis:latest", "redis:5"]
    defaults:
      run:
        shell: bash
        working-directory: Praktikum1
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Syntax prüfen
        run: python -m py_compile *.py tests/*.py scripts/*.py

      - name: Unit-Tests (ohne Datenbank)
        run: python -m unittest discover -s tests -p "test_1_unit.py" -v

      - name: Gesamter Ablauf (Container, Download von Sciebo, Aufgabe 1, Import, Antworten, Testkette)
        env:
          IMAGE: ${{ matrix.image }}
          OUT: results/ci
          PYTHON: python
        run: bash scripts/run_praktikum1.sh

      - name: Ergebnis prüfen (alle Stufen ausgeführt, nichts übersprungen)
        run: |
          grep -q "ERGEBNIS: BESTANDEN" results/ci/test_output.txt
          grep -E "^Gesamt +48 +48 +0 +0" results/ci/test_output.txt

      - name: Ergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: praktikum1-py${{ matrix.python }}-${{ strategy.job-index }}
          path: Praktikum1/results/ci/
